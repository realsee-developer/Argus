defaults:
  - default_dataset.yaml

exp_name: argus
img_size: 560
num_workers: 8
seed_value: 42
accum_steps: 1
patch_size: 14
val_epoch_freq: 5
max_img_per_gpu: 56
max_epochs: 150


model:
  _target_: argus.models.argus.Argus
  enable_camera: True
  enable_depth: True
  enable_point: True
  enable_cam_point: True
  enable_rotated_point: True
  reorder_by_learning_ref: True


loss:
  _target_: loss.MultitaskLoss
  camera: 
    weight: 5.0
    loss_type: "l1"
  depth:
    weight: 1.0
    gradient_loss_fn: "grad" 
    valid_range: 0.98
  cam_point: 
    weight: 1.0
    gradient_loss_fn: "normal" 
    valid_range: 0.98
  rotated_point: 
    weight: 1.0
    gradient_loss_fn: "normal" 
    valid_range: 0.98
  point: 
    weight: 1.0
    gradient_loss_fn: "normal" 
    valid_range: 0.98
  covisibility:
    weight: 0.1
  joint:
    weight_D2CP: 1.0
    weight_CP2RP: 1.0
    weight_RP2WP: 1.0
    weight_WP2RP: 1.0
    weight_RP2CP: 1.0
    weight_CP2D: 1.0




data:
  train:
    _target_: data.dynamic_dataloader.DynamicTorchDataset
    num_workers: ${num_workers}
    max_img_per_gpu: ${max_img_per_gpu}
    common_config:
      img_size: ${img_size}
      patch_size: ${patch_size}
      debug: False
      repeat_batch: False
    dataset:
      _target_: data.composed_dataset.ComposedDataset
      dataset_configs:
        - _target_: data.datasets.realsee3d.Realsee3DDataset
          split: train
          DATA_DIR: ./data/Realsee3D/dataset/real_world_data
          DATA_LIST: ./data/Realsee3D/dataset/real_world_scene_train.txt
          len_train: 900
        - _target_: data.datasets.realsee3d.Realsee3DDataset
          split: train
          DATA_DIR: ./data/Realsee3D/dataset/synthetic_data
          DATA_LIST: ./data/Realsee3D/dataset/synthetic_scene_train.txt
          len_train: 8100
  val:
    _target_: data.dynamic_dataloader.DynamicTorchDataset
    num_workers: ${num_workers}
    max_img_per_gpu: ${max_img_per_gpu}
    common_config:
      img_size: ${img_size}
      patch_size: ${patch_size}
      debug: False
    dataset:
      _target_: data.composed_dataset.ComposedDataset
      dataset_configs:
        - _target_: data.datasets.realsee3d.Realsee3DDataset
          split: test
          DATA_DIR: ./data/Realsee3D/dataset/real_world_data
          DATA_LIST: ./data/Realsee3D/dataset/real_world_scene_test.txt
          len_test: 100
        - _target_: data.datasets.realsee3d.Realsee3DDataset
          split: test
          DATA_DIR: ./data/Realsee3D/dataset/synthetic_data
          DATA_LIST: ./data/Realsee3D/dataset/synthetic_scene_test.txt
          len_test: 900


logging:
  log_dir: logs
  log_visuals: False
  log_freq: 1
  log_level_primary: DEBUG
  log_level_secondary: WARNING
  all_ranks: False
  tensorboard_writer:
    _target_: train_utils.tb_writer.TensorBoardLogger
    path: ${logging.log_dir}/tensorboard/${exp_name}
  scalar_keys_to_log:
    train:
      keys_to_log:
        - loss_objective
        - loss_camera
        - loss_T
        - loss_R
        - loss_camera_conf
        - loss_conf_T
        - loss_conf_R
        - loss_conf_depth
        - loss_reg_depth
        - loss_grad_depth
        - loss_conf_cam_points
        - loss_reg_cam_points
        - loss_grad_cam_points
        - loss_conf_rotated_points
        - loss_reg_rotated_points
        - loss_grad_rotated_points
        - loss_conf_world_points
        - loss_reg_world_points
        - loss_grad_world_points
        - loss_covisibility
        - loss_reg_D2CP
        - loss_conf_D2CP
        - loss_grad_D2CP
        - loss_reg_CP2RP
        - loss_conf_CP2RP
        - loss_grad_CP2RP
        - loss_reg_RP2WP
        - loss_conf_RP2WP
        - loss_grad_RP2WP
        - loss_reg_WP2RP
        - loss_conf_WP2RP
        - loss_grad_WP2RP
        - loss_reg_RP2CP
        - loss_conf_RP2CP
        - loss_grad_RP2CP
        - loss_reg_CP2D
        - loss_conf_CP2D
        - loss_grad_CP2D
    val:
      keys_to_log:
        - loss_objective
        - loss_camera
        - loss_T
        - loss_R
        - loss_camera_conf
        - loss_conf_T
        - loss_conf_R
        - loss_conf_depth
        - loss_reg_depth
        - loss_grad_depth
        - loss_conf_cam_points
        - loss_reg_cam_points
        - loss_grad_cam_points
        - loss_conf_rotated_points
        - loss_reg_rotated_points
        - loss_grad_rotated_points
        - loss_conf_world_points
        - loss_reg_world_points
        - loss_grad_world_points
        - loss_covisibility
        - loss_reg_D2CP
        - loss_conf_D2CP
        - loss_grad_D2CP
        - loss_reg_CP2RP
        - loss_conf_CP2RP
        - loss_grad_CP2RP
        - loss_reg_RP2WP
        - loss_conf_RP2WP
        - loss_grad_RP2WP
        - loss_reg_WP2RP
        - loss_conf_WP2RP
        - loss_grad_WP2RP
        - loss_reg_RP2CP
        - loss_conf_RP2CP
        - loss_grad_RP2CP
        - loss_reg_CP2D
        - loss_conf_CP2D
        - loss_grad_CP2D


checkpoint:
  save_dir: ${logging.log_dir}/ckpts/${exp_name}
  save_freq: 10
  resume_checkpoint_path: ./pretrained/vggt_1B_commercial.pt # from https://huggingface.co/facebook/VGGT-1B-Commercial
  strict: False
  pretrain_camera: True
  resume: False

optim:
  param_group_modifiers: False

  optimizer:
    _target_: torch.optim.AdamW
    lr: 5e-5
    weight_decay: 0.05

  amp:
    enabled: True
    amp_dtype: bfloat16
  gradient_clip:
    _target_: train_utils.gradient_clip.GradientClipper
    configs:
      - module_name: ["aggregator"]
        max_norm: 1.0
        norm_type: 2
      - module_name: ["depth"]
        max_norm: 1.0
        norm_type: 2
      - module_name: ["camera"]
        max_norm: 1.0
        norm_type: 2
      - module_name: ["cam_point"]
        max_norm: 1.0
        norm_type: 2
      - module_name: ["rotated_point"]
        max_norm: 1.0
        norm_type: 2
      - module_name: ["point"]
        max_norm: 1.0
        norm_type: 2
  options:
    lr:
      - scheduler:
          _target_: fvcore.common.param_scheduler.CompositeParamScheduler
          schedulers:
            - _target_: fvcore.common.param_scheduler.LinearParamScheduler
              start_value: 1e-8
              end_value: 5e-5
            - _target_: fvcore.common.param_scheduler.CosineParamScheduler
              start_value: 5e-5
              end_value: 1e-8
          lengths: [0.1, 0.9]
          interval_scaling: ['rescaled', 'rescaled']
    weight_decay:
      - scheduler:
          _target_: fvcore.common.param_scheduler.ConstantParamScheduler
          value: 0.05


distributed:
  # check https://docs.pytorch.org/docs/stable/generated/torch.nn.parallel.DistributedDataParallel.html for options
  backend: nccl
  comms_dtype: None
  find_unused_parameters: False
  timeout_mins: 5
  gradient_as_bucket_view: True  # Less memory used
  bucket_cap_mb: 25
  broadcast_buffers: True

cuda:
    cudnn_deterministic: False
    cudnn_benchmark: False
    allow_tf32: True
